databases:
  - name: docpilot-db
    plan: free
    databaseName: docpilot
    user: docpilot

services:
  # Django web service
  - type: web
    name: docpilot-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: GROQ_API_KEY
        sync: false
      - key: ILOVEPDF_PUBLIC_KEY
        sync: false
      - key: ILOVEPDF_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"

  # Telegram bot background worker
  - type: worker
    name: docpilot-bot
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py run_bot"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docpilot-db
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: docpilot-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ILOVEPDF_PUBLIC_KEY
        sync: false
      - key: ILOVEPDF_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
