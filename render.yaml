databases:
  - name: docpilot-db
    plan: free
    databaseName: docpilot
    user: docpilot

services:
  # Django web service & Bot (Running together)
  - type: web
    name: docpilot-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: docpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ILOVEPDF_PUBLIC_KEY
        sync: false
      - key: ILOVEPDF_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
